name: ci

# Deliberately cheap: no GPU, no datasets. This proves the package still imports
# and the pure-logic tests still hold. Data-backed tests skip themselves when the
# fixture is absent (see tests/conftest.py), so a fresh clone is green.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install (no heavy deps)
        run: |
          python -m pip install -U pip
          python -m pip install -e . --no-deps
          python -m pip install pytest numpy

      # Anything importable without jax/mujoco must stay importable.
      - name: Import check
        run: |
          python -c "import paths; print(paths.describe())"
          python -c "import TransformerFinal.experiment_groups as e; print(len(e.EXPERIMENT_NAMES), 'cohorts')"
          python -c "import TransformerFinal.direct_torque_utils as d; print(d.DIRECT_TORQUE_OUTPUT_DIM, 'channels')"

      # jax-dependent modules skip themselves via importorskip, so the whole
      # suite is safe to run here - no -k filter to drift out of date.
      - name: Tests (jax-dependent ones self-skip)
        run: pytest tests/ -q

      # Every .py must at least parse - catches a bad mechanical rewrite fast.
      - name: Syntax sweep
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for f in pathlib.Path('.').rglob('*.py'):
              if any(p in f.parts for p in ('__pycache__', 'myoconverter', 'datasets', 'artifacts')):
                  continue
              try: ast.parse(f.read_text(errors='ignore'))
              except SyntaxError as e: bad.append(f"{f}:{e.lineno} {e.msg}")
          print(f"parsed OK, {len(bad)} syntax errors")
          [print(' ', b) for b in bad]
          sys.exit(1 if bad else 0)
          PY
